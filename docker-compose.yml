services:
  transit-twin:
    build: .
    ports: ["8000:8000"]
    environment:
      - CAMERA_API_KEY=${CAMERA_API_KEY:-dev-key}
      - DEMO_CLOCK_START=${DEMO_CLOCK_START:-}
    volumes:
      # SQLite is slow on Windows/macOS bind mounts, so raw inputs and the DB live in a Docker volume
      - twin-data:/app/data
      - ./ml/models:/app/ml/models
      - ./reports:/app/reports

volumes:
  twin-data:
