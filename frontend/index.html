<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdf9f1" />
    <script>
      // Apply the saved light/dark choice (or the device setting) before first paint to avoid a flash.
      (function () {
        var t = null
        try { t = localStorage.getItem('kt-theme') } catch (e) {}
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#12141a' : '#fdf9f1')
      })()
    </script>
    <meta name="description" content="Crowd forecasts for buses, MRTS and metro in South Chennai. Demo data is simulated." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <title>Madras Flow · South Chennai crowd forecast</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>MadrasFlow needs JavaScript to show live crowd levels.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
