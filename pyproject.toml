[project]
name = "transit-twin"
version = "0.1.0"
description = "Public Transport Occupancy Predictor (South Chennai) - digital twin + crowd forecasting"
requires-python = ">=3.11,<3.12"
dependencies = [
  "simpy>=4.1", "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "scipy>=1.12",
  "pyyaml>=6", "holidays>=0.50", "requests>=2.31",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "sqlalchemy>=2.0",
  "networkx>=3.2", "apscheduler>=3.10,<4", "matplotlib>=3.8",
  "prophet>=1.1", "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
camera = ["ultralytics>=8.1", "opencv-python>=4.9", "paho-mqtt>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
