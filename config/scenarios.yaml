# Selectable twin scenarios (section 5.5). Effects are multipliers / timetable changes.
baseline:
  label: Normal weekday
weekend:
  label: Weekend profile
  day_type: weekend
rain_heavy:
  label: Heavy rain
  demand_mult: {bus: 1.15, metro: 1.10, mrts: 1.10}   # ASSUMPTION
  run_time_mult: 1.25                                   # ASSUMPTION
  dispatch_delay_mult: {bus: 1.5}                       # ASSUMPTION
cricket_match:
  label: Cricket match (Chepauk)
  venue_stop: MRTS_CHPK
  attendance: 35000
  catchment_capacity: 20000        # ASSUMPTION: arrivals x (1 + attendance/catchment) near venue
  before_h: 2
  after_h: 1
  match_start: "15:30"
  match_end: "19:00"
  day_total_mult: 1.2
college_reopening:
  label: College reopening week
  stop_type_mult: {college: 1.5}
metro_disruption:
  label: Metro disruption (headway x2 for 90 min)
  modes: [metro]
  headway_mult: 2.0
  window: ["08:30", "10:00"]
cyclone:
  label: Cyclone day (Michaung-style)
  # Pattern from Cyclone Michaung (Dec 2023): MTC suspended 1,000+ of ~3,861 buses, MRTS halted,
  # metro the only reliable mode; heavy rain adds 20-50 min to bus journeys (press reports).
  suspend_modes: [mrts]
  headway_mult: {bus: 1.35}         # ~26% of buses off the road (1,000 / 3,861)
  window: ["04:30", "23:30"]
  day_total_mult: 0.75              # ASSUMPTION: many people stay home or work from home
  demand_mult: {bus: 1.0, metro: 1.25, mrts: 1.0}   # ASSUMPTION: riders lean on metro
  run_time_mult: 1.5                # ASSUMPTION: +20-50 min on a ~60-90 min bus journey
  dispatch_delay_mult: {bus: 2.0}   # ASSUMPTION
extra_trips:
  label: Extra trips (what-if)
  extra_trips: []                  # [{route: BUS_95, direction: 0, start: "08:00", end: "09:30", n: 2}]
builder:
  label: Scenario builder (any mix of conditions and fleet changes)
  # Everything is optional; omitted parts keep a normal weekday. Passed as mods by the dashboard:
  #   day_type: weekday | weekend | holiday
  #   weather: dry | light | heavy | cyclone
  #   events: [{venue_stop, attendance, start "HH:MM", end "HH:MM"}]
  #   disruptions: [{kind: metro_delay | mrts_suspended | bus_cut, from "HH:MM", to "HH:MM"}]
  #   demand_pct: -50 .. +50
  #   fleet: [{route, direction (null = both), hour, buses}]
  event_defaults: {before_h: 2, after_h: 1}
  metro_delay_headway_mult: 2.0
  bus_cut_headway_mult: 1.35
custom:
  label: Custom multipliers (JSON)
